name: Schwiizerduetsch
options:
  bundleIdPrefix: com.connexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    DEVELOPMENT_TEAM: B97SQSQBMR
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Schwiizerduetsch:
    type: application
    platform: iOS
    sources:
      - path: Schwiizerduetsch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.schweizerdeutsch
        PRODUCT_NAME: Schwiizerduetsch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Schwiizerduetsch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Grüezi
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  Schwiizerduetsch:
    build:
      targets:
        Schwiizerduetsch: all
    run:
      storeKitConfiguration: Schwiizerduetsch/Resources/Products.storekit
    archive:
      config: Release
